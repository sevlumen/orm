name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "stable"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Cross-compile generator for Windows
        if: matrix.go == '1.25.x'
        run: |
          GOOS=windows GOARCH=amd64 go test -c ./generator -o /tmp/generator.test.exe
          GOOS=windows GOARCH=amd64 go test -c ./cmd/ormgen -o /tmp/ormgen.test.exe

      - name: Verify allocation budgets
        run: go test ./postgres/query -run '^TestTypedHotPathAllocationBudgets$' -count=1

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Run Go benchmark smoke
        if: matrix.go == '1.25.x'
        run: >-
          go test ./postgres/query
          -run '^$'
          -bench '^(BenchmarkStatementBuild|BenchmarkRowScan)$'
          -benchmem
          -benchtime=100x
          -count=1

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sevlumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sevlumen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SEVLUMEN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sevlumen_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Run PostgreSQL integration tests
        run: go test -race ./postgres/... -count=1

      - name: Run PostgreSQL benchmark smoke
        if: matrix.postgres == '18'
        run: >-
          go test ./postgres/query
          -run '^$'
          -bench '^(BenchmarkFetchOnePostgreSQL|BenchmarkRelationLoadPostgreSQL)$'
          -benchmem
          -benchtime=20x
          -count=1
