name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "stable"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          go list -mod=readonly -deps ./... >/dev/null

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Cross-compile commands for Windows
        if: matrix.go == '1.25.x'
        run: |
          GOOS=windows GOARCH=amd64 go test -c ./generator -o /tmp/generator.test.exe
          GOOS=windows GOARCH=amd64 go test -c ./cmd/ormgen -o /tmp/ormgen.test.exe
          GOOS=windows GOARCH=amd64 go test -c ./cmd/orm -o /tmp/orm.test.exe

      - name: Verify allocation budgets
        run: go test ./postgres/query -run '^TestTypedHotPathAllocationBudgets$' -count=1

      - name: Test with race detector
        run: go test -race ./... -count=1

      - name: Run Go benchmark smoke
        if: matrix.go == '1.25.x'
        run: >-
          go test ./postgres/query
          -run '^$'
          -bench '^(BenchmarkStatementBuild|BenchmarkRowScan)$'
          -benchmem
          -benchtime=100x
          -count=1

  security:
    name: Security and compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go list -mod=readonly -deps ./... >/dev/null

      - name: Reject legacy driver references
        shell: bash
        run: |
          set -euo pipefail
          needle="$(printf '\160\147\170')"
          matches="$(grep -RIn --exclude-dir=.git -- "$needle" . || true)"
          if [[ -n "$matches" ]]; then
            echo "Legacy PostgreSQL driver references remain:"
            echo "$matches"
            exit 1
          fi

      - name: Run vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -test ./...

      - name: Run fuzz smoke
        shell: bash
        run: |
          set -euo pipefail
          go test ./entity -run '^$' -fuzz '^FuzzParseTag$' -fuzztime=2s
          go test ./migration -run '^$' -fuzz '^FuzzParseSnapshot$' -fuzztime=2s
          go test ./migration -run '^$' -fuzz '^FuzzRenameValidate$' -fuzztime=2s
          go test ./migration/artifact -run '^$' -fuzz '^FuzzParseManifest$' -fuzztime=2s
          go test ./internal/ormcli -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime=2s
          go test ./postgres/query -run '^$' -fuzz '^FuzzSelectValueRemainsParameterized$' -fuzztime=2s
          go test ./postgres/query -run '^$' -fuzz '^FuzzMetadataValidationNeverPanics$' -fuzztime=2s
          go test ./postgres/runner -run '^$' -fuzz '^FuzzValidateMigrationScript$' -fuzztime=2s
          go test ./postgres/runner -run '^$' -fuzz '^FuzzStatementPrefixesBounded$' -fuzztime=2s

      - name: Verify public API surface
        run: go run ./cmd/apicheck -baseline api/v1

      - name: Verify documentation links
        run: go run ./cmd/doccheck

  postgres:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "14"
            image: postgres:14@sha256:2f439458ab6a57a925825ae14f9d06910e4fe4a41c8d4a0ae06397e65b707e1b
          - version: "18"
            image: postgres:18@sha256:d129b9577d274bb96cbd44d902bdeb1b935c89247d161241e9154cba64e13df4

    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sevlumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sevlumen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SEVLUMEN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sevlumen_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Run PostgreSQL integration tests
        run: go test -race ./postgres/... -count=1

      - name: Run PostgreSQL benchmark smoke
        if: matrix.version == '18'
        run: >-
          go test ./postgres/query
          -run '^$'
          -bench '^(BenchmarkFetchOnePostgreSQL|BenchmarkRelationLoadPostgreSQL)$'
          -benchmem
          -benchtime=20x
          -count=1
