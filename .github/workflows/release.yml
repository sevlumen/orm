name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  quality:
    name: Release quality and security
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Validate tag and clean source
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA"
          test "$(git cat-file -t "$tag")" = tag
          test -z "$(git status --porcelain)"

      - name: Verify dependencies and formatting
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          go list -mod=readonly -deps ./... >/dev/null
          test -z "$(gofmt -l .)"

      - name: Run quality tests
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test -race ./... -count=1
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -test ./...
          go run ./cmd/apicheck -baseline api/v1
          go run ./cmd/doccheck

      - name: Run release fuzz smoke
        shell: bash
        run: |
          set -euo pipefail
          go test ./entity -run '^$' -fuzz '^FuzzParseTag$' -fuzztime=2s
          go test ./migration -run '^$' -fuzz '^FuzzParseSnapshot$' -fuzztime=2s
          go test ./migration -run '^$' -fuzz '^FuzzRenameValidate$' -fuzztime=2s
          go test ./migration/artifact -run '^$' -fuzz '^FuzzParseManifest$' -fuzztime=2s
          go test ./internal/ormcli -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime=2s
          go test ./postgres/query -run '^$' -fuzz '^FuzzSelectValueRemainsParameterized$' -fuzztime=2s
          go test ./postgres/query -run '^$' -fuzz '^FuzzMetadataValidationNeverPanics$' -fuzztime=2s
          go test ./postgres/runner -run '^$' -fuzz '^FuzzValidateMigrationScript$' -fuzztime=2s
          go test ./postgres/runner -run '^$' -fuzz '^FuzzStatementPrefixesBounded$' -fuzztime=2s

  postgres:
    name: Release PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '14'
            image: postgres:14@sha256:2f439458ab6a57a925825ae14f9d06910e4fe4a41c8d4a0ae06397e65b707e1b
          - version: '18'
            image: postgres:18@sha256:d129b9577d274bb96cbd44d902bdeb1b935c89247d161241e9154cba64e13df4

    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sevlumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sevlumen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SEVLUMEN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sevlumen_test?sslmode=disable
      SEVLUMEN_RC_ORM_BINARY: /tmp/sevlumen-orm

    steps:
      - name: Check out exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run PostgreSQL release tests
        run: |
          go mod download
          go mod verify
          go test -race ./postgres/... -count=1

      - name: Build exact CLI for the RC application
        run: go build -trimpath -o "$SEVLUMEN_RC_ORM_BINARY" ./cmd/orm

      - name: Run maintained release-candidate application
        run: go test -race ./examples/rcapp -run '^TestReleaseCandidateWorkflow$' -count=1 -v

  publish:
    name: Build, attest, and publish
    needs: [quality, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Build release artifacts twice
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release="${tag#v}"
          release_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          test "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA"
          test "$(git cat-file -t "$tag")" = tag
          go mod download
          go mod verify
          go run ./cmd/releasepack -root . -out dist \
            -version "$tag" -commit "$GITHUB_SHA" -date "$release_date"
          go run ./cmd/releasepack -root . -out dist-rebuild \
            -version "$tag" -commit "$GITHUB_SHA" -date "$release_date"
          diff -ru --no-dereference dist dist-rebuild
          go run ./cmd/releaseverify -dir dist
          echo "sbom_path=dist/sevlumen-orm_${release}_sbom.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Exercise released Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME#v}"
          mkdir extracted
          tar -xzf "dist/sevlumen-orm_${release}_linux_amd64.tar.gz" -C extracted
          root="extracted/sevlumen-orm_${release}_linux_amd64"
          "$root/orm" version --json | jq -e \
            --arg version "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            '.result.version == $version and .result.commit == $commit and .result.dirty == false'
          "$root/ormgen" -version-json | jq -e \
            --arg version "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit and .dirty == false'

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*

      - name: Attest SPDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: ${{ steps.release_metadata.outputs.sbom_path }}

      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$tag" \
            --notes-file docs/releases.md \
            "${prerelease[@]}"
