name: Verify v1.0.0 publication

on:
  push:
    branches: [main]
    paths:
      - .github/releases/v1.0.0.verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.0.0'
          target='48f3d6df6b9dfd9cbeb5205db7c1bbad6bde3500'

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git cat-file -t "$tag")" = tag
          test "$(git rev-list -n1 "$tag")" = "$target"

          release_json=''
          for attempt in $(seq 1 120); do
            if release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,publishedAt,url 2>/dev/null)"; then
              break
            fi
            sleep 5
          done

          test -n "$release_json"
          jq -e --arg tag "$tag" '.tagName == $tag and .isDraft == false and .isPrerelease == false and (.publishedAt | length > 0) and (.url | length > 0)' <<<"$release_json" >/dev/null

          published_at="$(jq -r '.publishedAt' <<<"$release_json")"
          url="$(jq -r '.url' <<<"$release_json")"
          printf 'release=%s\ntarget=%s\npublished_at=%s\nurl=%s\n' "$tag" "$target" "$published_at" "$url" > .github/releases/v1.0.0.published

          git add .github/releases/v1.0.0.published
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Confirm ORM v1.0.0 publication"
          git push origin HEAD:main
